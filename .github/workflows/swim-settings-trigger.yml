# =============================================================================
# SWIM PSIRT pipeline — triggered when Settings/settings.json changes
# =============================================================================
# Self-hosted lab runner: executes directly in SWIM_LAB_ROOT (from runner .env).
# Skips actions/checkout so job logs never print the local workspace path.
# =============================================================================
name: SWIM PSIRT Pipeline

on:
  push:
    branches: [master, main]
    paths:
      - 'Settings/settings.json'
  workflow_dispatch:

concurrency:
  group: swim-psirt-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  swim-remediation:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Prepare lab job
        id: prepare
        run: bash "${SWIM_LAB_ROOT}/scripts/ci/prepare-job.sh"

      - name: Run SWIM pipeline
        id: swim
        run: bash "${SWIM_LAB_ROOT}/scripts/ci/run-swim-pipeline.sh"

      - name: Collect reports
        if: always() && steps.prepare.outcome == 'success' && steps.swim.outcome != 'cancelled' && steps.swim.outcome != 'skipped'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bash "${SWIM_LAB_ROOT}/scripts/collect-swim-reports.sh" \
            "${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}" \
            "${{ steps.prepare.outputs.start_epoch }}"

      - name: Commit and push reports
        if: always() && steps.prepare.outcome == 'success' && steps.swim.outcome != 'cancelled' && steps.swim.outcome != 'skipped'
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash "${SWIM_LAB_ROOT}/scripts/ci/commit-reports.sh"
