# =============================================================================
# SWIM PSIRT pipeline — triggered when Settings/settings.json changes
# =============================================================================
name: SWIM PSIRT Pipeline

on:
  push:
    branches: [master, main]
    paths:
      - 'Settings/settings.json'
  workflow_dispatch:

concurrency:
  group: swim-psirt-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  swim-remediation:
    runs-on: self-hosted
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link lab environment
        run: bash scripts/ci/link-lab-environment.sh

      - name: Record pipeline start time
        id: pipeline
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run SWIM pipeline
        id: swim
        run: bash scripts/ci/run-swim-pipeline.sh

      - name: Collect reports
        if: always() && steps.swim.outcome != 'cancelled'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bash scripts/collect-swim-reports.sh \
            "${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}" \
            "${{ steps.pipeline.outputs.start_epoch }}"

      - name: Commit and push reports
        if: always() && steps.swim.outcome != 'cancelled'
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/ci/commit-reports.sh
