---
# =============================================================================
# swim / import_and_tag.yml  —  Stage 01.1: remote import + assign + golden tag
# =============================================================================
# Consumes swim_details.import_images, swim_details.product_assignments and
# swim_details.golden_tag_images (from load_swim_details.yml). Requires the HTTP
# image server (stage 00.1).
#
# Three steps, in this order — the middle one is mandatory for side-loaded
# images, because CatC refuses to tag an image golden until it is bound to a
# device family:
#   1. import  — pull each image into the CatC repository by URL
#   2. assign  — bind each image to its device product name (image family)/site
#   3. tag     — mark the upgrade image golden for the family, role and site
#
# Pre:  swim_details.import_images[].import_image_details.url_details.source_url
# Post: images in CatC repository, each bound to a device family, upgrade image
#       flagged golden per site/role
# =============================================================================

# ── Build swim_details from the central data model ───────────────────────────
# Sources CICD Pipeline/Settings/settings.json (path from `settings_json_path`,
# relative paths resolved against playbook_dir). For every `project[]` entry it
# reads the `swim` block:
#   image_server_base_url, upgrade_image, rollback_image,
#   device_image_family_name, device_family_name, device_series_name, device_role,
#   activation.{device_upgrade_mode, distribute_if_needed, schedule_validate}
# `site_name` is derived by joining HierarchyParent/Area/Bldg/Floor — the same
# composition used by stages 01 and 09 — so it is never hardcoded here.
#
# Produces the full `swim_details` dict. This file consumes three of its keys:
#   swim_details.import_images[]     — de-duplicated union of upgrade_image and
#     rollback_image across all projects. Each item:
#       name: "<image filename>"
#       import_image_details.type: "remote"
#       import_image_details.url_details.payload[0].source_url:
#         ["<image_server_base_url>/<image filename>"]   ← served by stage 00.1
#       import_image_details.url_details.payload[0].is_third_party: false
#   swim_details.product_assignments[] — one item per (image, family, site),
#     de-duplicated across projects. Each item:
#       name: "<image> -> <device_image_family_name> @ <site_name>"
#       image_name / product_name / site_name
#   swim_details.golden_tag_images[] — one item per project entry:
#       name: "<upgrade_image> @ <site_name> / <device_role>"
#       tagging_details: { image_name, device_role, device_image_family_name,
#                          site_name, tagging: true }
#
# The remaining keys (distribute_images, activate_images, rollback_images) are
# built here but consumed by stages 01.2–02.1.
- name: Load SWIM image details from settings.json
  ansible.builtin.import_tasks: load_swim_details.yml

- name: Import image into Catalyst Center repository
  cisco.catalystcenter.swim_workflow_manager:
    catalystcenter_host: "{{ catalystcenter_host }}"
    catalystcenter_username: "{{ catalystcenter_username }}"
    catalystcenter_password: "{{ catalystcenter_password }}"
    catalystcenter_verify: "{{ catalystcenter_verify }}"
    catalystcenter_port: "{{ catalystcenter_port }}"
    catalystcenter_version: "{{ catalystcenter_version }}"
    catalystcenter_log: "{{ catalystcenter_log }}"
    catalystcenter_log_level: "{{ catalystcenter_log_level }}"
    catalystcenter_log_file_path: "{{ catalystcenter_log_file_path }}"
    catalystcenter_log_append: "{{ catalystcenter_log_append }}"
    validate_response_schema: "{{ validate_response_schema }}"
    catalystcenter_api_task_timeout: "{{ catalystcenter_api_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ catalystcenter_task_poll_interval }}"
    config_verify: true
    state: merged
    config:
      - import_image_details: "{{ item.import_image_details }}"
  loop: "{{ swim_details.import_images }}"
  loop_control:
    label: "{{ item.name }}"
  register: import_result

# Images imported from a non-cisco.com URL land under "Imported Images" with no
# device family bound, and CatC will not let an unbound image be tagged golden.
# swim_workflow_manager has no option for this, so the binding runs here between
# import and tag. See assign_product_names.yml for the documented behaviour.
- name: Assign device product name to imported images
  ansible.builtin.import_tasks: assign_product_names.yml

- name: Tag image golden per family, role, and site
  cisco.catalystcenter.swim_workflow_manager:
    catalystcenter_host: "{{ catalystcenter_host }}"
    catalystcenter_username: "{{ catalystcenter_username }}"
    catalystcenter_password: "{{ catalystcenter_password }}"
    catalystcenter_verify: "{{ catalystcenter_verify }}"
    catalystcenter_port: "{{ catalystcenter_port }}"
    catalystcenter_version: "{{ catalystcenter_version }}"
    catalystcenter_log: "{{ catalystcenter_log }}"
    catalystcenter_log_level: "{{ catalystcenter_log_level }}"
    catalystcenter_log_file_path: "{{ catalystcenter_log_file_path }}"
    catalystcenter_log_append: "{{ catalystcenter_log_append }}"
    validate_response_schema: "{{ validate_response_schema }}"
    catalystcenter_api_task_timeout: "{{ catalystcenter_api_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ catalystcenter_task_poll_interval }}"
    config_verify: true
    state: merged
    config:
      - tagging_details: "{{ item.tagging_details }}"
  loop: "{{ swim_details.golden_tag_images }}"
  loop_control:
    label: "{{ item.name }}"
  register: tag_result

- name: Write import and tag evidence
  ansible.builtin.include_tasks: write_evidence.yml
  vars:
    evidence_name: 10_import_and_tag
    evidence_data: >-
      {{ {'import': import_result,
          'assign_product_names': assign_product_name_results | default([]),
          'tag': tag_result} }}
