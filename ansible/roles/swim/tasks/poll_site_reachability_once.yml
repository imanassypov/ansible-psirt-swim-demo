---
# =============================================================================
# swim / poll_site_reachability_once.yml — single reachability poll iteration
# =============================================================================
# Sets swim_reachability_pending_count (int) and swim_reachability_pending (IPs).
# Ready = Reachable and not Unified AP (matches CatC inventory reachability UI).
# Expects loop var `item` = attempt number from wait_for_site_reachability.yml.
# =============================================================================

- name: Initialise reachability poll accumulators
  ansible.builtin.set_fact:
    _reachability_pending_ips: []

- name: Assess device reachability per target site
  ansible.builtin.include_tasks: assess_site_reachability.yml
  loop: "{{ swim_target_sites }}"
  loop_control:
    loop_var: reachability_site_name
    label: "{{ reachability_site_name }}"

- name: Update reachability poll status
  ansible.builtin.set_fact:
    swim_reachability_pending: "{{ _reachability_pending_ips | unique | list }}"
    swim_reachability_pending_count: "{{ _reachability_pending_ips | length | int }}"

- name: Report devices still unreachable this poll cycle
  ansible.builtin.debug:
    msg: >-
      Reachability poll attempt {{ item }}/{{ _reachability_poll_attempts | int }}:
      waiting for {{ swim_reachability_pending | join(', ') }}.
      Gate requires reachabilityStatus=Reachable (collectionStatus may still be
      Partial Collection Failure while UI shows green).
  when: (swim_reachability_pending_count | int) > 0

- name: Pause before next reachability poll cycle
  ansible.builtin.pause:
    seconds: "{{ _reachability_poll_interval | int }}"
  when:
    - (swim_reachability_pending_count | int) > 0
    - (item | int) < (_reachability_poll_attempts | int)

- name: "DEBUG | Reachability poll status"
  ansible.builtin.debug:
    msg:
      attempt: "{{ item }}/{{ _reachability_poll_attempts | int }}"
      pending_count: "{{ swim_reachability_pending_count | int }}"
      pending: "{{ swim_reachability_pending }}"
  when: catc_debug | default(false) | bool
