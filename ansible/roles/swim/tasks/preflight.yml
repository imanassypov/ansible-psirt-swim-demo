---
# =============================================================================
# swim / preflight.yml  —  Stage 02: pre-upgrade baseline
# =============================================================================
# Pre-flight before SWIM import/distribute/activate: load swim_details from
# settings.json, resync device inventory at target sites, baseline IMAGE
# compliance per site.
#
# Prerequisites: settings.json swim block per project entry
# Produces: swim_target_sites, preflight_resync, compliance baseline registers,
#           swim_compliance_report (printed as the final task)
# =============================================================================

- name: Load SWIM image details from settings.json
  ansible.builtin.import_tasks: load_swim_details.yml

# Example
#   In : swim_details.golden_tag_images = [
#          { "tagging_details": { "site_name": "Global/PODS/POD 0/Building P0/Floor 1" } },
#          { "tagging_details": { "site_name": "Global/PODS/POD 1/Building P1/Floor 2" } },
#          { "tagging_details": { "site_name": "Global/PODS/POD 0/Building P0/Floor 1" } }
#        ]
#   Out: swim_target_sites = [
#          "Global/PODS/POD 0/Building P0/Floor 1",
#          "Global/PODS/POD 1/Building P1/Floor 2"
#        ]
#   map → 3 site strings, unique → drops the repeated POD 0 entry, so each site
#   is resynced and compliance-checked once no matter how many images target it.
- name: Derive target sites from golden tag images
  ansible.builtin.set_fact:
    swim_target_sites: >-
      {{ swim_details.golden_tag_images
         | map(attribute='tagging_details.site_name')
         | unique | list }}

- name: Resync devices at target sites to refresh inventory state
  cisco.catalystcenter.inventory_workflow_manager:
    catalystcenter_host: "{{ catalystcenter_host }}"
    catalystcenter_username: "{{ catalystcenter_username }}"
    catalystcenter_password: "{{ catalystcenter_password }}"
    catalystcenter_verify: "{{ catalystcenter_verify }}"
    catalystcenter_port: "{{ catalystcenter_port }}"
    catalystcenter_version: "{{ catalystcenter_version }}"
    catalystcenter_log: "{{ catalystcenter_log }}"
    catalystcenter_log_level: "{{ catalystcenter_log_level }}"
    catalystcenter_log_file_path: "{{ catalystcenter_log_file_path }}"
    catalystcenter_log_append: "{{ catalystcenter_log_append }}"
    validate_response_schema: "{{ validate_response_schema }}"
    catalystcenter_api_task_timeout: "{{ catalystcenter_api_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ catalystcenter_task_poll_interval }}"
    state: merged
    config:
      - site_name: "{{ item }}"
        device_resync: true
        force_sync: false
  loop: "{{ swim_target_sites }}"
  loop_control:
    label: "{{ item }}"
  register: preflight_resync
  tags: [resync]

- name: Baseline image compliance check per wave site
  cisco.catalystcenter.network_compliance_workflow_manager:
    catalystcenter_host: "{{ catalystcenter_host }}"
    catalystcenter_username: "{{ catalystcenter_username }}"
    catalystcenter_password: "{{ catalystcenter_password }}"
    catalystcenter_verify: "{{ catalystcenter_verify }}"
    catalystcenter_port: "{{ catalystcenter_port }}"
    catalystcenter_version: "{{ catalystcenter_version }}"
    catalystcenter_log: "{{ catalystcenter_log }}"
    catalystcenter_log_level: "{{ catalystcenter_log_level }}"
    catalystcenter_log_file_path: "{{ catalystcenter_log_file_path }}"
    catalystcenter_log_append: "{{ catalystcenter_log_append }}"
    validate_response_schema: "{{ validate_response_schema }}"
    catalystcenter_api_task_timeout: "{{ catalystcenter_api_task_timeout }}"
    catalystcenter_task_poll_interval: "{{ catalystcenter_task_poll_interval }}"
    state: merged
    config:
      - site_name: "{{ item }}"
        run_compliance: true
        run_compliance_categories:
          - IMAGE
        sync_device_config: false
  loop: "{{ swim_target_sites }}"
  loop_control:
    label: "{{ item }}"
  register: precheck_compliance

- name: Write preflight evidence
  ansible.builtin.include_tasks: write_evidence.yml
  vars:
    evidence_name: 00_preflight
    evidence_data: "{{ {'resync': preflight_resync | default({}), 'compliance': precheck_compliance} }}"

# Example
#   In : precheck_compliance.results = [
#          {
#            "item":   "Global/PODS/POD 0/Building P0/Floor 1",
#            "failed": false,
#            "msg": {
#              "Run Compliance Check Skipped for following device(s)": {
#                "skipped_devices": ["leaf01.dcloud.cisco.com"]
#              }
#            }
#          },
#          {
#            "item":   "Global/PODS/POD 1/Building P1/Floor 2",
#            "failed": true,
#            "msg":    "An error occurred while running compliance check"
#          }
#        ]
#        preflight_resync.failed = false
#   Out: preflight_skipped_devices = ["leaf01.dcloud.cisco.com"]
#        preflight_failed_compliance = [
#          {
#            "item":   "Global/PODS/POD 1/Building P1/Floor 2",
#            "failed": true,
#            "msg":    "An error occurred while running compliance check"
#          }
#        ]
#        preflight_resync_failed = false
#        preflight_has_issues    = true
#   select('mapping') drops entries whose msg is a plain error string, so the
#   skipped-device walk never faults on a failed site.
- name: Evaluate pre-flight results for issues
  vars:
    compliance_results: "{{ precheck_compliance.results | default([]) }}"
    skipped_devices: >-
      {{ compliance_results
         | map(attribute='msg')
         | select('mapping')
         | map(attribute='Run Compliance Check Skipped for following device(s)')
         | select('defined')
         | map(attribute='skipped_devices')
         | flatten }}
    failed_compliance: >-
      {{ compliance_results
         | selectattr('failed', 'defined')
         | selectattr('failed')
         | list }}
    resync_failed: "{{ preflight_resync.failed | default(false) }}"
  ansible.builtin.set_fact:
    preflight_skipped_devices: "{{ skipped_devices }}"
    preflight_failed_compliance: "{{ failed_compliance }}"
    preflight_resync_failed: "{{ resync_failed }}"
    preflight_has_issues: >-
      {{ (skipped_devices | length > 0)
         or (failed_compliance | length > 0)
         or (resync_failed | bool) }}

- name: Validate compliance and report
  block:
    - name: Fail when pre-flight has hard errors
      ansible.builtin.fail:
        msg: >-
          Pre-flight hard errors detected — resync_failed={{ preflight_resync_failed }},
          compliance_task_failures={{ preflight_failed_compliance | length }}.
          See logs/{{ swim_run_id }}-00_preflight.json for details.
      when: (preflight_resync_failed | bool) or (preflight_failed_compliance | length > 0)
  always:
    - name: Build IMAGE compliance site reports
      vars:
        compliance_results: "{{ precheck_compliance.results | default([]) }}"
        _site_reports_json: >-
          {% set reports = [] %}
          {% for site in compliance_results %}
          {% set site_name = site.item %}
          {% set devices = [] %}
          {% if site.response is mapping %}
          {% for dev in site.response | dict2items %}
          {% set rec = dev.value | first | default({}) %}
          {% set diff = (rec.sourceInfoList | default([]) | first | default({})).diffList | default([]) | first | default({}) %}
          {% set _ = devices.append({
            'device': dev.key,
            'status': rec.status | default('UNKNOWN'),
            'configured_image': diff.configuredValue | default('n/a'),
            'intended_image': diff.intendedValue | default('n/a')
          }) %}
          {% endfor %}
          {% endif %}
          {% set summary = site.msg if site.msg is mapping else {} %}
          {% set success_msg = summary.get('Run Compliance Check Succeeded for following device(s)', {}) %}
          {% set skipped_msg = summary.get('Run Compliance Check Skipped for following device(s)', {}) %}
          {% set _ = reports.append({
            'site': site_name,
            'task_failed': site.failed | default(false),
            'compliant': success_msg.get('Compliant Devices', 0),
            'non_compliant': success_msg.get('Non-Compliant Devices', 0),
            'total_checked': success_msg.get('Total Devices Checked', 0),
            'skipped_devices': skipped_msg.get('skipped_devices', []),
            'devices': devices
          }) %}
          {% endfor %}
          {{ reports | to_json }}
      ansible.builtin.set_fact:
        _parsed_compliance_site_reports: "{{ _site_reports_json | from_json }}"

    - name: Assemble IMAGE compliance report
      ansible.builtin.set_fact:
        swim_compliance_report:
          stage: validate_compliance
          run_id: "{{ swim_run_id }}"
          sites: "{{ _parsed_compliance_site_reports }}"
          totals:
            compliant: "{{ _parsed_compliance_site_reports | map(attribute='compliant') | map('int') | sum }}"
            non_compliant: "{{ _parsed_compliance_site_reports | map(attribute='non_compliant') | map('int') | sum }}"
            total_checked: "{{ _parsed_compliance_site_reports | map(attribute='total_checked') | map('int') | sum }}"
          skipped_devices: "{{ preflight_skipped_devices | default([]) }}"
          resync_failed: "{{ preflight_resync_failed | default(false) }}"
          compliance_task_failures: "{{ preflight_failed_compliance | default([]) | length }}"

    - name: Format IMAGE compliance report table
      vars:
        _compliance_report_output_json: >-
          {% set lines = [] %}
          {% set _ = lines.append('=== SWIM IMAGE Compliance Report (' ~ swim_run_id ~ ') ===') %}
          {% set _ = lines.append('') %}
          {% for site in swim_compliance_report.sites %}
          {% set _ = lines.append('Site: ' ~ site.site) %}
          {% set _ = lines.append(
               'Compliant: ' ~ site.compliant
               ~ ' | Non-compliant: ' ~ site.non_compliant
               ~ ' | Checked: ' ~ site.total_checked) %}
          {% set _ = lines.append('') %}
          {% set _ = lines.append(
               'Device'.ljust(16)
               ~ 'Status'.ljust(16)
               ~ 'Configured'.ljust(22)
               ~ 'Intended') %}
          {% set _ = lines.append(
               ('-' * 16) ~ '  '
               ~ ('-' * 16) ~ '  '
               ~ ('-' * 22) ~ '  '
               ~ ('-' * 22)) %}
          {% for dev in site.devices %}
          {% set _ = lines.append(
               (dev.device | string).ljust(16)
               ~ (dev.status | string).ljust(16)
               ~ (dev.configured_image | string).ljust(22)
               ~ (dev.intended_image | string)) %}
          {% endfor %}
          {% if site.skipped_devices | length > 0 %}
          {% set _ = lines.append('') %}
          {% set _ = lines.append('Skipped: ' ~ (site.skipped_devices | join(', '))) %}
          {% endif %}
          {% set _ = lines.append('') %}
          {% endfor %}
          {% set totals = swim_compliance_report.totals %}
          {% set _ = lines.append(
               'Overall — compliant: ' ~ totals.compliant
               ~ ', non-compliant: ' ~ totals.non_compliant
               ~ ', checked: ' ~ totals.total_checked) %}
          {% if swim_compliance_report.skipped_devices | length > 0 %}
          {% set _ = lines.append(
               'Skipped devices: ' ~ (swim_compliance_report.skipped_devices | join(', '))) %}
          {% endif %}
          {% set _ = lines.append('Evidence file: logs/' ~ swim_run_id ~ '-00_preflight.json') %}
          {{ lines | to_json }}
      ansible.builtin.set_fact:
        swim_compliance_report_output: "{{ _compliance_report_output_json | from_json }}"

    - name: Output IMAGE compliance report
      ansible.builtin.debug:
        msg: "{{ swim_compliance_report_output }}"
