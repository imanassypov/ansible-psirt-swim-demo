---
# =============================================================================
# swim / wait_for_site_reachability.yml — post-activate reachability gate
# =============================================================================
# Polls Catalyst Center until site-assigned devices report reachabilityStatus
# Reachable (matches inventory UI) before resync + IMAGE compliance.
# =============================================================================

- name: Skip reachability wait when disabled in settings
  when: not (swim_details.reachability.enabled | default(true) | bool)
  ansible.builtin.set_fact:
    swim_reachability_pending_count: 0
    swim_reachability_pending: []

- name: Poll device reachability before post-activate compliance
  when: swim_details.reachability.enabled | default(true) | bool
  block:
    - name: Compute reachability poll interval and timeout
      ansible.builtin.set_fact:
        _reachability_poll_interval: "{{ swim_details.reachability.poll_interval | default(60) | int }}"
        _reachability_poll_timeout: "{{ swim_details.reachability.poll_timeout | default(600) | int }}"

    - name: Compute reachability poll attempt count
      ansible.builtin.set_fact:
        _reachability_poll_attempts: "{{ ((_reachability_poll_timeout | int) // (_reachability_poll_interval | int)) | int }}"

    - name: Initialise reachability poll state
      ansible.builtin.set_fact:
        swim_reachability_pending_count: 1
        swim_reachability_pending: []

    - name: Wait for all target site devices to become reachable
      ansible.builtin.include_tasks: poll_site_reachability_once.yml
      loop: "{{ range(1, (_reachability_poll_attempts | int) + 1) | list }}"
      loop_control:
        label: "poll attempt {{ item }}/{{ _reachability_poll_attempts | int }}"
      when: (swim_reachability_pending_count | default(1) | int) > 0

    - name: Fail when devices remain unreachable after poll timeout
      ansible.builtin.fail:
        msg: >-
          Post-activate reachability poll timed out after {{ _reachability_poll_timeout }}s.
          Devices still not Reachable in Catalyst Center API:
          {{ swim_reachability_pending | join(', ') }}.
          Check inventory reachabilityStatus (UI green is not enough if API still reports Unreachable).
          Raise activation.reachability_poll_timeout in settings.json if reloads are slow.
      when: (swim_reachability_pending_count | default(0) | int) > 0

    - name: Reachability poll succeeded
      ansible.builtin.debug:
        msg: "All site-assigned devices report Reachable in Catalyst Center — proceeding to post-activate compliance."
      when: (swim_reachability_pending_count | default(1) | int) == 0
