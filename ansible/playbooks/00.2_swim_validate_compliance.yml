---
# =============================================================================
# 00.2_swim_validate_compliance.yml  —  Pipeline stage 00.2 (SWIM lifecycle, read-only)
# =============================================================================
# IMAGE compliance validation with two modes:
#
#   Default (no extra-vars):
#     Pre-upgrade baseline — resync inventory, run IMAGE compliance, write
#     logs/<run_id>-00_preflight.json, print pre-upgrade report.
#
#   Post-activation (-e post_activate=true):
#     Post-upgrade check — resync, run IMAGE compliance, load the pre-upgrade
#     baseline from logs/ (newest *-00_preflight.json, or -e preflight_run_id=),
#     print combined pre/post report and write:
#       logs/<run_id>-00_post_activate.json
#       logs/<run_id>-00_compliance_pre_post.json
#
# Sourced:
#   settings.json → project[].swim (via swim/load_swim_details.yml)
#   connection.yml: catalystcenter_* connection + logging params
#   vault.yml: catc_username, catc_password
#
# Depends on: devices assigned to sites in Catalyst Center inventory
#
# Run (pre-upgrade):
#   ansible-playbook playbooks/00.2_swim_validate_compliance.yml
#
# Run (post-activation, after 01.3):
#   ansible-playbook playbooks/00.2_swim_validate_compliance.yml -e post_activate=true
#
# Pin a specific pre-upgrade baseline:
#   ansible-playbook playbooks/00.2_swim_validate_compliance.yml \
#     -e post_activate=true -e preflight_run_id=20260814-140000
# =============================================================================
- name: SWIM validate compliance
  hosts: catalyst_center
  connection: local
  gather_facts: false
  vars_files:
    - ../inventory/group_vars/catalyst_center/vault.yml
  vars:
    swim_run_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"
    post_activate: false
  tasks:
    - name: Run SWIM validate compliance
      ansible.builtin.import_role:
        name: swim
        tasks_from: validate_compliance
